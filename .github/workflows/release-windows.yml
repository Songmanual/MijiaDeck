name: Build Windows portable release

on:
  # Publishing a user-tested local ZIP must not rebuild or replace that ZIP.
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag matching the source version (created after checks pass)
        required: true
        default: v1.0.2
        type: string

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install runtime and packaging dependencies
        run: python -m pip install . PySide6==6.8.3 pyinstaller==6.16.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          architecture: x64
      - name: Build pinned camera backend and private Java runtime
        shell: pwsh
        run: python tools/install_camera_backend.py --jdk "$env:JAVA_HOME"
      - name: Run offline regression checks
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -m unittest tests.tray_activation_test tests.windowed_startup_test tests.branding_test tests.audio_sync_test
          tests.camera_drag_test tests.camera_preview_test tests.camera_window_test
          tests.footer_account_test tests.grid_width_test tests.room_tabs_test
          tests.theme_color_test tests.tray_position_test tests.tray_room_filter_test
          tests.tray_settings_test tests.voice_layout_test tests.window_frame_test
      - name: Build portable ZIP and collect licenses
        run: python tools/build_portable.py --with-camera
      - name: Validate relocated executable without Python on PATH
        run: python tools/test_portable.py
      - name: Validate full-directory overwrite upgrade from v1.0.1
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release download v1.0.1 --repo "$env:GITHUB_REPOSITORY" --pattern MijiaDeck-v1.0.1-windows-x64.zip --dir build/previous
          if ($LASTEXITCODE -ne 0) { throw "Previous release download failed" }
          python tools/test_portable.py --previous-zip build/previous/MijiaDeck-v1.0.1-windows-x64.zip
          if ($LASTEXITCODE -ne 0) { throw "Overwrite upgrade validation failed" }
      - name: Retain build and check artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MijiaDeck-windows-x64
          path: |
            dist/portable/*.zip
            dist/portable/*.sha256
            build/packaged-check.json
            build/startup-check.json
      - name: Attach verified portable package to release
        if: github.event_name == 'release' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        shell: pwsh
        run: |
          $sourceTag = python -c "from app import __version__; print('v' + __version__)"
          if ($env:RELEASE_TAG -ne $sourceTag) { throw "Release tag does not match the source version" }
          $assets = @((Get-ChildItem dist/portable/*.zip).FullName, (Get-ChildItem dist/portable/*.sha256).FullName)
          gh release view "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:RELEASE_TAG" @assets --repo "$env:GITHUB_REPOSITORY" --clobber
          } else {
            gh release create "$env:RELEASE_TAG" @assets --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "MijiaDeck $env:RELEASE_TAG" --notes-file "docs/release-$env:RELEASE_TAG.md"
          }
          if ($LASTEXITCODE -ne 0) { throw "Release upload failed" }
          # One-time correction of the initial release's descriptive title.
          if ($sourceTag -eq 'v1.0.2') {
            gh release edit v1.0.1 --repo "$env:GITHUB_REPOSITORY" --title "MijiaDeck v1.0.1" --notes-file docs/release-v1.0.1.md
            if ($LASTEXITCODE -ne 0) { throw "Previous release title update failed" }
          }
